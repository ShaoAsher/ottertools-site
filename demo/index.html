<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>水獭工具 · 交互原型 · 2.0</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   水獭工具 · 原型令牌（与水獭 Git / 游时记同源，见 方案.md §1）
   品牌 獭橙；状态四色只给水、徽标、台词（方案.md §2）
   ═══════════════════════════════════════════════════════════════ */
:root{
  --canvas:#0B0A14; --surface:#13111E; --raised:#1B1829; --line:rgba(255,255,255,.07);
  --hi:#F4F2FA; --mid:#A09BB4; --lo:#7F7A93;
  --accent:#FF8A3D; --accent2:#FFB04A; --onAccent:#1A0E06;
  --calm:#5FC9E8; --busy:#FFAA5A; --alarm:#FF6B6B; --ok:#6EE7A8; --stone:#E0C27A;
  --card:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));
  --pane:rgba(19,17,30,.9); --glass:rgba(13,12,22,.62); --chrome:rgba(11,10,20,.5); --field:#0F0D18; --ink:255,255,255;
  --scrim:rgba(4,3,10,.6);
  --ease:cubic-bezier(.22,1,.36,1); --draw:cubic-bezier(.2,0,0,1); --rise:cubic-bezier(.34,1.45,.64,1);
  --pop:cubic-bezier(.3,1.5,.5,1); --exit:cubic-bezier(.55,0,1,.45);
  --r-lg:22px; --r-md:16px; --r-sm:12px; --r-xs:10px;
  --mono:"SF Mono",Menlo,monospace;
}
[data-theme=day]{
  --canvas:#F5F4F8; --surface:#FFFFFF; --raised:#FFFFFF; --line:rgba(23,21,31,.08);
  --hi:#1A1726; --mid:#55506A; --lo:#77728B;
  --accent:#C8501A; --accent2:#F08A3E; --onAccent:#FFFFFF;
  --calm:#1F7DB8; --busy:#B45F06; --alarm:#D0343A; --ok:#1E8A55; --stone:#9A6A00;
  --card:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,0) 60%);
  --pane:rgba(255,255,255,.9); --glass:rgba(255,255,255,.72); --chrome:rgba(245,244,248,.6); --field:#F1F0F5; --ink:23,21,31;
  --scrim:rgba(26,23,38,.32);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#050409;color:var(--hi);font:14px/1.45 -apple-system,"PingFang SC","SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ── 舞台 ─────────────────────────────────────────────── */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding-right:240px}
#console{position:fixed;right:0;top:0;bottom:0;width:240px;padding:18px 16px;background:#0d0c14;border-left:1px solid rgba(255,255,255,.06);overflow:auto;color:#cfcbe0;font-size:13px}
#console h1{font-size:15px;font-weight:800;color:#fff;margin-bottom:2px}
#console .sub{color:#7f7a93;font-size:12px;margin-bottom:14px}
#console h2{font-size:11px;letter-spacing:.8px;color:#7f7a93;margin:16px 0 6px;font-weight:700}
#console .opt{display:flex;flex-wrap:wrap;gap:6px}
#console .opt button{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);font-size:12px;color:#cfcbe0;transition:.2s}
#console .opt button.on{background:#FF8A3D;color:#1a0e06;border-color:#FF8A3D;font-weight:700}
#console p{color:#8a85a0;font-size:12px;line-height:1.6;margin-top:8px}
#win{width:1280px;height:800px;flex:none;border-radius:12px;overflow:hidden;position:relative;transform-origin:center;box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);background:var(--canvas);transition:background .6s var(--ease)}
#ambient{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;color:var(--hi)}

/* ── 外壳 ─────────────────────────────────────────────── */
.titlebar{height:28px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:12px;color:var(--lo)}
.titlebar i{width:12px;height:12px;border-radius:50%;display:inline-block}
.titlebar span{margin:0 auto;transform:translateX(-30px)}
.body{flex:1;display:flex;min-height:0;gap:10px;padding:0 10px 10px}
.cardp{background:var(--pane);border:.5px solid var(--line);border-radius:var(--r-md);box-shadow:0 8px 24px rgba(0,0,0,.18);position:relative;isolation:isolate}
.cardp::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--card);pointer-events:none;border-radius:inherit}
.statusbar{height:28px;flex:none;display:flex;align-items:center;gap:16px;padding:0 16px;font-size:12px;color:var(--lo);background:var(--chrome);backdrop-filter:blur(12px);border-top:.5px solid var(--line)}
.statusbar b{color:var(--mid);font-weight:600}
.statusbar .dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}
.statusbar .sp{flex:1}

/* 侧栏 */
.side{width:236px;flex:none;display:flex;flex-direction:column;padding:12px 10px 10px;overflow:hidden}
.brand{display:flex;align-items:center;gap:9px;padding:2px 6px 12px}
.brand img{width:30px;height:30px;border-radius:8px}
.brand b{font-size:14.5px;font-weight:800;letter-spacing:-.2px}
.fam{font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);margin-left:auto}
.me{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:rgba(var(--ink),.035);border:.5px solid var(--line);cursor:pointer;transition:background .2s}
.me:hover{background:rgba(var(--ink),.06)}
.me img{width:50px;height:50px;object-fit:contain;flex:none;animation:float 2.4s ease-in-out infinite}
.me .n{font-weight:800;font-size:14px}
.me .tone{font-size:12px;font-weight:700;color:var(--tone);display:flex;align-items:center;gap:5px}
.me .tone i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor}
.me .say{font-size:12px;color:var(--mid);margin-top:2px;line-height:1.4}
.cmdk{margin:10px 0 6px;height:34px;border-radius:11px;background:var(--field);border:.5px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 8px 0 10px;color:var(--lo);font-size:12.5px;transition:border .2s}
.cmdk:hover{border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.cmdk .sp{flex:1;text-align:left}
kbd{font:600 10.5px var(--mono);min-width:18px;height:18px;padding:0 4px;border-radius:5px;display:inline-grid;place-items:center;color:var(--mid);background:rgba(var(--ink),.06);border:.5px solid rgba(var(--ink),.12);box-shadow:0 1px 0 rgba(var(--ink),.12)}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.nv{height:40px;display:flex;align-items:center;gap:10px;padding:0 8px;border-radius:11px;color:var(--mid);cursor:pointer;position:relative;transition:background .2s,color .2s}
.nv:hover{background:rgba(var(--ink),.05);color:var(--hi)}
.nv .b{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);transition:transform .42s var(--pop)}
.nv .b svg{width:16px;height:16px}
.nv .t{font-size:13.5px;font-weight:600}
.nv .m{margin-left:auto;font-size:11.5px;color:var(--lo)}
.nv.on{color:var(--hi);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.nv.on .t{font-weight:800}
.nv.on::before{content:"";position:absolute;left:-6px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.nv.on .b{transform:scale(1.06)}
.side .sp{flex:1}
.dev{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;border:.5px solid var(--line);margin-top:6px;cursor:pointer}
.dev:hover{background:rgba(var(--ink),.04)}
.dev .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(var(--ink),.06);color:var(--mid)}
.dev b{font-size:12.5px;display:block}
.dev span{font-size:11px;color:var(--lo)}
.dev .bar{height:3px;border-radius:2px;background:rgba(var(--ink),.08);margin-top:5px;overflow:hidden}
.dev .bar i{display:block;height:100%;background:var(--tone);border-radius:2px;transition:width .9s var(--ease)}

/* 主区 */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.phead{display:flex;align-items:center;gap:10px;padding:6px 4px 12px 6px}
.phead h1{font-size:24px;font-weight:800;letter-spacing:-.8px;line-height:1.15}
.phead h1 em{font-style:normal;color:var(--accent)}
.phead p{font-size:12.5px;color:var(--mid);margin-top:2px}
.phead .sp{flex:1}
.ib{width:34px;height:34px;border-radius:50%;background:rgba(var(--ink),.06);border:.5px solid rgba(var(--ink),.08);display:grid;place-items:center;color:var(--mid);transition:background .12s,transform .12s,color .12s}
.ib:hover{background:rgba(var(--ink),.11);color:var(--hi)}
.ib:active{transform:scale(.94)}
.ib svg{width:16px;height:16px}
.otbtn{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 4px;border-radius:999px;background:rgba(var(--ink),.06);border:.5px solid rgba(var(--ink),.08);font-size:12.5px;font-weight:700;color:var(--hi)}
.otbtn img{width:28px;height:28px;object-fit:contain}
.otbtn:hover{background:rgba(var(--ink),.1)}
.grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:1fr 1fr 1fr;grid-auto-rows:min-content;gap:10px;padding:0 2px 2px}

/* 首页 · 水面主卡 */
.hero{grid-column:1/-1;height:232px;overflow:hidden;border-radius:var(--r-lg)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:inherit}
.hero .sky{position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 90% at 80% 0%,color-mix(in srgb,var(--tone) 16%,transparent),transparent 60%);transition:background .9s var(--ease);pointer-events:none}
.glass{position:absolute;left:14px;top:14px;bottom:14px;width:452px;border-radius:18px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);border:.5px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;z-index:2}
.score{display:flex;gap:16px;align-items:center}
.ring{width:96px;height:96px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:rgba(var(--ink),.09)}
.ring .ar{stroke:var(--sc);transition:stroke .6s}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .v b{font-size:31px;font-weight:800;letter-spacing:-1.4px;line-height:1}
.ring .v small{display:block;font-size:10.5px;color:var(--lo);font-weight:600;margin-top:2px}
.score .k{font-size:11.5px;font-weight:700;color:var(--lo);letter-spacing:.4px}
.score h2{font-size:22px;font-weight:800;letter-spacing:-.6px;margin-top:2px;display:flex;align-items:center;gap:8px}
.score h2 .st{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;color:var(--sc);background:color-mix(in srgb,var(--sc) 15%,transparent);display:flex;align-items:center;gap:4px}
.score h2 .st svg{width:12px;height:12px;stroke-width:2.4}
.score p{font-size:12.5px;color:var(--mid);margin-top:4px;line-height:1.5}
.contrib{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:10px 0 auto}
.contrib div{font-size:11.5px;color:var(--mid)}
.contrib div b{float:right;color:var(--hi);font-weight:700}
.contrib .bar{height:4px;border-radius:2px;background:rgba(var(--ink),.09);margin-top:6px;overflow:hidden}
.contrib .bar i{display:block;height:100%;border-radius:2px;background:var(--c);width:0}
.acts{display:flex;gap:8px;align-items:center}
.acts .hint{margin-left:auto;font-size:11.5px;color:var(--lo);display:flex;gap:4px;align-items:center}
.otter-float{position:absolute;width:104px;height:104px;z-index:1;pointer-events:auto;cursor:pointer;left:0;top:0;will-change:transform}
.otter-float img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.bubble{position:absolute;left:0;top:0;z-index:3;max-width:230px;padding:9px 12px;border-radius:14px 14px 4px 14px;background:var(--glass);backdrop-filter:blur(14px);border:.5px solid var(--line);font-size:12.5px;line-height:1.45;color:var(--hi);pointer-events:none;will-change:transform}
.legend{position:absolute;right:14px;bottom:12px;z-index:2;display:flex;gap:6px}
.legend span{font-size:11px;padding:4px 9px;border-radius:999px;background:var(--glass);backdrop-filter:blur(10px);border:.5px solid var(--line);color:var(--mid);white-space:nowrap}
.legend span b{color:var(--hi);font-weight:700;margin-left:3px}
/* 养护进度（替换玻璃板内容） */
.steps{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.stp{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--lo);transition:color .26s}
.stp .s{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(var(--ink),.18);flex:none;transition:.26s}
.stp .s svg{width:12px;height:12px;stroke-width:2.6;opacity:0}
.stp .r{margin-left:auto;font-size:12px;color:var(--lo)}
.stp.run{color:var(--hi);font-weight:700}
.stp.run .s{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.stp.done{color:var(--mid)}
.stp.done .s{background:var(--ok);border-color:var(--ok);color:var(--canvas)}
.stp.done .s svg{opacity:1}
.stp.done .r{color:var(--hi)}
@keyframes spin{to{transform:rotate(360deg)}}

/* 通用卡头 */
.ch{display:flex;align-items:baseline;gap:8px;padding:14px 16px 8px}
.ch h3{font-size:14.5px;font-weight:800}
.ch span{font-size:11.5px;color:var(--lo)}
.ch .sp{flex:1}
.ch a{font-size:12px;color:var(--mid);cursor:pointer}
.ch a:hover{color:var(--accent)}

/* 建议 */
.sugg{grid-column:span 2}
.sg{display:flex;align-items:center;gap:12px;padding:7px 16px;cursor:pointer;transition:background .12s}
.sg+.sg{border-top:.5px solid rgba(var(--ink),.05)}
.sg:hover{background:rgba(var(--ink),.03)}
.sg .b{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.sg .tx{flex:1;min-width:0}
.sg .tx b{font-size:13.5px;font-weight:700;display:block}
.sg .tx span{font-size:12px;color:var(--mid)}
.imp{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;white-space:nowrap}
.imp.h{color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent)}
.imp.m{color:var(--mid);background:rgba(var(--ink),.07)}
.ghost{height:30px;padding:0 12px;border-radius:10px;background:rgba(var(--ink),.07);border:.5px solid rgba(var(--ink),.1);color:var(--hi);font-weight:600;font-size:12.5px;white-space:nowrap;transition:background .12s,transform .12s}
.ghost:hover{background:rgba(var(--ink),.12)}
.ghost:active{transform:scale(.96)}
.ghost.lg{height:38px;padding:0 16px;border-radius:12px;font-size:13.5px}

/* 石头罐 */
.jar{display:flex;flex-direction:column;overflow:hidden}
.jar .in{display:flex;gap:12px;align-items:flex-end;padding:0 16px 14px;flex:1}
.jar svg.pot{width:104px;height:124px;flex:none;cursor:pointer;overflow:visible}
.jar .k{font-size:11.5px;color:var(--lo);font-weight:600}
.jar .big{font-size:30px;font-weight:800;letter-spacing:-1.2px;line-height:1.1}
.jar .big small{font-size:15px;font-weight:700;margin-left:2px;color:var(--mid)}
.jar .sub{font-size:12px;color:var(--mid);margin-top:4px;line-height:1.5}
.memo{margin-top:10px;padding:8px 10px;border-radius:12px;background:color-mix(in srgb,var(--stone) 10%,transparent);border:.5px solid color-mix(in srgb,var(--stone) 25%,transparent);font-size:11.5px;color:var(--mid);line-height:1.5}
.memo b{color:var(--stone)}

/* 指标 + 直接去做 */
.mets{grid-column:span 2;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.met{padding:12px 14px 10px;cursor:pointer;transition:transform .26s var(--ease)}
.met:hover{transform:translateY(-2px)}
.met .k{font-size:11.5px;color:var(--lo);font-weight:600;display:flex;align-items:center;gap:6px}
.met .k i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.met .v{font-size:22px;font-weight:800;letter-spacing:-.6px;margin-top:4px}
.met .v small{font-size:12px;color:var(--mid);font-weight:600;margin-left:2px}
.met .s{font-size:11.5px;color:var(--mid)}
.met svg.sp{width:100%;height:30px;margin-top:6px;display:block}
.met [data-p]{stroke:var(--c);transition:stroke .6s} .met [data-f]{fill:var(--c);opacity:.12}
.tools{padding-bottom:8px}
.tools .ch{padding:12px 16px 4px}
.tg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 10px}
.tl{display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 2px;border-radius:12px;font-size:11.5px;color:var(--mid);cursor:pointer;position:relative;transition:background .12s,color .12s}
.tl:hover{background:rgba(var(--ink),.05);color:var(--hi)}
.tl .b{width:30px;height:30px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);transition:transform .42s var(--pop)}
.tl:hover .b{transform:translateY(-2px) scale(1.05)}
.tl kbd{position:absolute;top:4px;right:6px;opacity:0;transition:opacity .12s}
.tl:hover kbd{opacity:1}

/* ── slab ─────────────────────────────────────────────── */
.slab{position:relative;height:38px;padding:0 18px;border-radius:12px;font-weight:800;font-size:13.5px;letter-spacing:.3px;color:var(--onAccent);
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 90%,#fff),var(--accent));
  box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 58%,#000),0 8px 18px -4px color-mix(in srgb,var(--accent) 40%,transparent);
  transition:transform .12s var(--ease),box-shadow .12s var(--ease),filter .2s;overflow:hidden;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.slab:hover{filter:brightness(1.06)}
.slab:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 58%,#000),0 4px 10px -4px color-mix(in srgb,var(--accent) 30%,transparent)}
.slab.danger{--accent:#FF5A6E;color:#fff}
.slab.block{width:100%;justify-content:center;height:42px}
.slab svg{width:16px;height:16px;stroke-width:2.2}
.wave{position:absolute;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%) scale(0);background:rgba(255,255,255,.24);animation:wave .56s var(--ease) forwards}
@keyframes wave{to{transform:translate(-50%,-50%) scale(1);opacity:0}}
@keyframes float{50%{transform:translateY(-3px)}}

/* ── 弹窗：统一居中（与水獭 Git 最终原型同一套）───────────
   确认 ask → 原地变形成进度 busy → 原地变形成结果 oc；次要反馈只在状态栏闪一下 */
.scrim{position:absolute;inset:0;z-index:20;background:var(--scrim);display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .26s}
.scrim.on{display:flex}
.scrim.show{opacity:1}
.dlg{background:var(--raised);border:.5px solid var(--line);border-radius:var(--r-lg);box-shadow:0 40px 80px -10px rgba(0,0,0,.55),0 4px 12px rgba(0,0,0,.3);position:relative;overflow:hidden;isolation:isolate;color:var(--hi);transform:translateY(18px) scale(.94);opacity:0;transition:transform .42s var(--rise),opacity .26s}
.dlg::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--card);pointer-events:none}
.scrim.show .dlg{transform:none;opacity:1}
.scrim.out .dlg{transform:translateY(10px) scale(.97);opacity:0;transition:transform .26s var(--exit),opacity .2s}
.ask{width:400px;text-align:center;padding:24px 24px 20px}
.ask img{width:92px;height:92px;animation:float 2.4s ease-in-out infinite}
.ask h3{font-size:19px;font-weight:800;margin-top:8px;letter-spacing:-.4px}
